    <script>
      (function() {
        // Prevent extension errors when third-party extensions try to assign window.fetch in strict environments
        try {
          var realFetch = window.fetch;
          var fetchHolder = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHolder;
            },
            set: function(val) {
              fetchHolder = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }

        // Suppress unhandled errors from installed Chrome extensions
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
